<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score-Based Progress Tracker</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .metric-card {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
        }
        .metric-card:hover {
            transform: translateY(-2px);
        }
        .task-list-item:nth-child(even) {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 bg-gray-50">
    <div id="app-container" class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-6 text-center">
            Progress Score Tracker (SBPT)
        </h1>
        <p class="text-center text-gray-600 mb-8">
            Track anything: Academics, Work, Fitness. Focus on high-value tasks!
        </p>

        <!-- Metrics Dashboard: Now includes Daily Goal -->
        <div id="metrics-dashboard" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-10">
            <!-- Today's Score (Primary Metric) -->
            <div class="metric-card bg-indigo-600 text-white p-5 rounded-xl text-center">
                <p class="text-sm font-medium opacity-80">Today's Score</p>
                <p id="today-score" class="text-4xl font-bold mt-1">0</p>
            </div>
            
            <!-- NEW: Daily Goal Progress -->
            <div id="daily-goal-card" class="metric-card p-5 rounded-xl text-center cursor-pointer transition duration-150" title="Click to set your daily score goal">
                <p class="text-sm font-medium" id="daily-goal-title">Daily Goal Progress</p>
                <p id="daily-goal-progress" class="text-3xl font-bold mt-1">0 / 50</p>
            </div>
            
            <!-- Average Task Value (VvV Ratio - Quality Metric) -->
            <div class="metric-card bg-white p-5 rounded-xl text-center border-b-4 border-amber-500">
                <p class="text-sm font-medium text-gray-600">Avg Task Value (VvV)</p>
                <p id="vvv-ratio" class="text-3xl font-bold text-amber-600 mt-1">0.0</p>
            </div>
            
            <!-- Last 7 Days Score -->
            <div class="metric-card bg-white p-5 rounded-xl text-center">
                <p class="text-sm font-medium text-gray-600">7-Day Score</p>
                <p id="week-score" class="text-3xl font-bold text-gray-800 mt-1">0</p>
            </div>
            
            <!-- Total Lifetime Score -->
            <div class="metric-card bg-white p-5 rounded-xl text-center">
                <p class="text-sm font-medium text-gray-600">Lifetime Score</p>
                <p id="lifetime-score" class="text-3xl font-bold text-gray-800 mt-1">0</p>
            </div>
        </div>

        <!-- Task Input and List Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Add New Task Form -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Add New Task</h2>
                <form id="add-task-form" class="space-y-4">
                    <div>
                        <label for="task-description" class="block text-sm font-medium text-gray-700">Task/Goal</label>
                        <input type="text" id="task-description" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label for="task-points" class="block text-sm font-medium text-gray-700">Point Value (1, 5, or 10)</label>
                        <select id="task-points" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="10">10 - High Value / Crucial</option>
                            <option value="5">5 - Medium Value / Standard</option>
                            <option value="1">1 - Low Value / Maintenance</option>
                        </select>
                    </div>
                    <div>
                        <label for="target-date" class="block text-sm font-medium text-gray-700">Target Date</label>
                        <input type="date" id="target-date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <button type="submit" class="w-full py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        Add Task
                    </button>
                </form>
            </div>

            <!-- Task List -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
                    Active Tasks
                    <!-- Profile and Streak Display -->
                    <div class="flex items-center space-x-3">
                         <!-- Daily Streak -->
                        <span id="daily-streak-display" class="text-sm font-semibold text-emerald-600 flex items-center bg-emerald-100 px-3 py-1 rounded-full shadow-md">
                            🔥 0
                        </span>
                        <!-- Username Display/Set Button -->
                        <button id="user-display-button" class="text-xs font-medium bg-gray-100 text-gray-500 px-3 py-1 rounded-full shadow-md transition duration-150">Loading...</button>
                    </div>
                </h2>
                <div id="tasks-list" class="space-y-2">
                    <!-- Tasks will be injected here -->
                    <p id="loading-message" class="text-center text-gray-500 py-8">Loading tasks...</p>
                </div>
            </div>
        </div>
        
        <!-- Custom Message Box for Errors/Info -->
        <div id="message-box" class="fixed bottom-4 right-4 bg-red-100 border-l-4 border-red-500 text-red-700 p-4 hidden rounded-lg shadow-xl" role="alert">
            <p class="font-bold" id="message-box-title">Error</p>
            <p id="message-box-body">Something went wrong.</p>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        setLogLevel('Debug'); // Enable Firestore debug logs

        // --- GLOBAL CONFIGURATION AND INITIALIZATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db;
        let auth;
        let userId = null;
        let isAuthReady = false;
        
        // Unified user profile state
        let userProfile = { 
            username: null, 
            dailyStreak: 0, 
            lastCompletionDate: null,
            dailyGoal: 50 // NEW: Default daily score goal
        }; 

        const tasksListEl = document.getElementById('tasks-list');
        const loadingMessageEl = document.getElementById('loading-message');
        const dailyStreakDisplayEl = document.getElementById('daily-streak-display');
        // NEW UI Element references
        const dailyGoalProgressEl = document.getElementById('daily-goal-progress');
        const dailyGoalCardEl = document.getElementById('daily-goal-card');


        const showMessage = (title, body, type = 'error', duration = 4000) => {
            const box = document.getElementById('message-box');
            const titleEl = document.getElementById('message-box-title');
            const bodyEl = document.getElementById('message-box-body');

            box.className = `fixed bottom-4 right-4 p-4 rounded-lg shadow-xl transition-all duration-300 ${
                type === 'success' ? 'bg-green-100 border-l-4 border-green-500 text-green-700' : 
                type === 'info' ? 'bg-blue-100 border-l-4 border-blue-500 text-blue-700' :
                'bg-red-100 border-l-4 border-red-500 text-red-700'
            }`;
            titleEl.textContent = title;
            bodyEl.textContent = body;
            box.classList.remove('hidden');

            setTimeout(() => {
                box.classList.add('hidden');
            }, duration);
        };

        // --- Date Helpers ---
        const getDayStart = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        };

        const isSameDay = (d1, d2) => {
            const date1 = getDayStart(d1);
            const date2 = getDayStart(d2);
            return date1.getTime() === date2.getTime();
        };

        const isYesterday = (date) => {
            const d = getDayStart(new Date());
            d.setDate(d.getDate() - 1); // Set d to the start of yesterday
            return isSameDay(date, d);
        };

        const isWithinLast7Days = (date) => {
            const today = getDayStart(new Date());
            const sevenDaysAgo = getDayStart(new Date());
            sevenDaysAgo.setDate(today.getDate() - 7);
            return getDayStart(date) >= sevenDaysAgo && getDayStart(date) <= today;
        };

        const isCurrentMonth = (date) => {
            const today = new Date();
            return date.getFullYear() === today.getFullYear() &&
                   date.getMonth() === today.getMonth();
        };
        
        const isCurrentYear = (date) => {
            const today = new Date();
            return date.getFullYear() === today.getFullYear();
        };


        // --- USER PROFILE, STREAK, AND GOAL LOGIC ---

        const getUserProfileDocRef = (uid) => {
            // Path to user-specific profile info document
            return doc(db, `artifacts/${appId}/users/${uid}/profile/info`);
        };

        const loadUserProfile = async (uid) => {
            try {
                const docRef = getUserProfileDocRef(uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    userProfile.username = data.username || null;
                    userProfile.dailyStreak = parseInt(data.dailyStreak || 0, 10);
                    userProfile.lastCompletionDate = data.lastCompletionDate || null;
                    userProfile.dailyGoal = parseInt(data.dailyGoal || 50, 10); // NEW: Load daily goal
                    
                    // Streak maintenance check on load
                    maintainStreakOnLoad();
                }
            } catch (error) {
                console.warn("Could not load user profile:", error);
            }
            updateUserDisplay();
        };
        
        // Runs immediately after loading to ensure the streak is not stale
        const maintainStreakOnLoad = () => {
            if (!userProfile.lastCompletionDate) return;
            
            const lastDate = new Date(userProfile.lastCompletionDate);
            const today = new Date();

            // If the last completion was yesterday or today, streak is valid.
            if (isSameDay(lastDate, today) || isYesterday(lastDate)) {
                return; 
            }
            
            // If the last completion was before yesterday, the streak is broken.
            const dayBeforeYesterday = getDayStart(new Date());
            dayBeforeYesterday.setDate(dayBeforeYesterday.getDate() - 2); 
            
            if (lastDate < dayBeforeYesterday) {
                userProfile.dailyStreak = 0;
                userProfile.lastCompletionDate = null;
                saveUserProfile(userProfile.username, true); // Update streak reset immediately
            }
        };


        const updateUserStreak = async () => {
            if (!isAuthReady || !userId) return;

            const today = new Date();
            
            // 1. Check if a task was already completed today
            if (userProfile.lastCompletionDate && isSameDay(new Date(userProfile.lastCompletionDate), today)) {
                // Already got credit for today, do nothing.
                return;
            }

            let newStreak = userProfile.dailyStreak;

            if (userProfile.lastCompletionDate) {
                const lastDate = new Date(userProfile.lastCompletionDate);

                if (isYesterday(lastDate)) {
                    // Streak continues!
                    newStreak += 1;
                    showMessage("Streak!", `Daily streak increased to ${newStreak} days!`, "success", 3000);
                } else {
                    // Streak is broken (completion was before yesterday)
                    newStreak = 1;
                    showMessage("New Streak!", "Started a new daily streak!", "info", 3000);
                }
            } else {
                // First ever completion
                newStreak = 1;
                showMessage("First Completion!", "You started your first daily streak!", "success", 3000);
            }
            
            // Update the profile state
            userProfile.dailyStreak = newStreak;
            userProfile.lastCompletionDate = today.toISOString();
            
            // Save the updated streak and date
            await saveUserProfile(userProfile.username, true);
        };
        
        const saveUserProfile = async (newUsername, isSilent = false) => {
            if (!isAuthReady || !userId) return;
            
            if (newUsername && newUsername.trim().length < 3) {
                 showMessage("Validation Error", "Username must be at least 3 characters.", "error", 3000);
                 return;
            }

            try {
                const docRef = getUserProfileDocRef(userId);
                
                const dataToSave = {
                    username: newUsername ? newUsername.trim() : userProfile.username,
                    dailyStreak: userProfile.dailyStreak,
                    lastCompletionDate: userProfile.lastCompletionDate,
                    dailyGoal: userProfile.dailyGoal // NEW: Save daily goal
                };
                
                // setDoc with merge creates the document if it doesn't exist
                await setDoc(docRef, dataToSave, { merge: true });
                
                // Update local state and UI
                userProfile.username = dataToSave.username;
                updateUserDisplay();
                
                if (!isSilent) {
                    showMessage("Success", `Profile updated.`, "success", 3000);
                }
            } catch (error) {
                console.error("Error saving user profile:", error);
                showMessage("Error", "Failed to save user profile data.", "error");
            }
        };
        
        // NEW: Function to handle setting the daily goal
        const setDailyGoal = () => {
            if (!isAuthReady || !userId) {
                 showMessage("Wait", "Authentication is still loading. Please wait a moment.", "info", 2000);
                 return;
            }

            const currentGoal = userProfile.dailyGoal || 50;
            const newGoalStr = prompt(`Enter your daily score goal (Current: ${currentGoal} points). Enter 0 to disable.`);

            if (newGoalStr !== null) {
                const newGoal = parseInt(newGoalStr.trim(), 10);
                if (!isNaN(newGoal) && newGoal >= 0) {
                    userProfile.dailyGoal = newGoal;
                    saveUserProfile(userProfile.username, false);
                    showMessage("Goal Set", `Daily score goal updated to ${newGoal} points!`, "success", 3000);
                } else {
                    showMessage("Validation Error", "Please enter a valid number (0 or higher).", "error", 3000);
                }
            }
        };


        const updateUserDisplay = () => {
            const btn = document.getElementById('user-display-button');
            if (!btn) return;
            
            // Update Username Display
            if (userProfile.username) {
                btn.textContent = `Welcome, ${userProfile.username}`;
                btn.className = 'text-xs font-semibold bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1 rounded-full transition duration-150 shadow-md';
            } else if (userId) {
                btn.textContent = `Set Username (ID: ${userId.substring(0, 5)}...)`;
                btn.className = 'text-xs font-medium bg-amber-100 hover:bg-amber-200 text-amber-700 px-3 py-1 rounded-full transition duration-150 shadow-md';
            } else {
                btn.textContent = 'Loading User...';
                btn.className = 'text-xs font-medium bg-gray-100 text-gray-500 px-3 py-1 rounded-full';
            }
            
            // Update Streak Display
            dailyStreakDisplayEl.innerHTML = `🔥 ${userProfile.dailyStreak}`;
        };
        
        // NEW: Function to update the daily goal UI based on the current score
        const updateDailyGoalDisplay = (goal, currentScore) => {
            const score = parseInt(currentScore, 10);
            const goalEl = dailyGoalProgressEl;
            const cardEl = dailyGoalCardEl;

            if (!goalEl || !cardEl) return;
            
            // Base class for the card
            let cardClass = 'metric-card p-5 rounded-xl text-center cursor-pointer transition duration-150 hover:shadow-lg';
            
            if (goal > 0) {
                goalEl.textContent = `${score} / ${goal}`;
                if (score >= goal) {
                    // Goal met!
                    cardClass += ' bg-emerald-600 text-white';
                    cardEl.title = "Daily Goal ACHIEVED! Click to change goal.";
                } else {
                    // Goal not met
                    cardClass += ' bg-indigo-100 text-indigo-800 hover:bg-indigo-200';
                    cardEl.title = `Click to set your daily score goal. You need ${goal - score} more points.`;
                }
            } else {
                // Goal disabled
                goalEl.textContent = 'Disabled';
                cardClass += ' bg-gray-100 text-gray-500 hover:bg-gray-200';
                cardEl.title = "Click to set your daily score goal.";
            }
            
            // Apply the final class
            cardEl.className = cardClass;
        };


        // --- FIREBASE INITIALIZATION AND AUTHENTICATION ---
        const initFirebase = async () => {
            try {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.error("Firebase config is missing.");
                    return;
                }
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                // 1. Monitor Auth State
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        isAuthReady = true;
                        // Load profile/username/streak immediately after auth
                        await loadUserProfile(userId); 
                        startTaskListener();
                    } else if (initialAuthToken) {
                        // Sign in with provided token if available
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        // Fallback to anonymous sign-in
                        const anonUser = await signInAnonymously(auth);
                        userId = anonUser.user.uid;
                        isAuthReady = true;
                        await loadUserProfile(userId);
                        startTaskListener();
                    }
                });
                
                // 2. Attach Listener for Username Button
                document.getElementById('user-display-button').addEventListener('click', () => {
                    if (!isAuthReady || !userId) {
                         showMessage("Wait", "Authentication is still loading. Please wait a moment.", "info", 2000);
                         return;
                    }

                    const currentName = userProfile.username || '';
                    const newName = prompt(`Enter your desired username (Current: ${currentName || 'None'}). This will be permanently saved.`);

                    if (newName !== null && newName.trim()) {
                        saveUserProfile(newName.trim());
                    } else if (newName !== null) {
                        showMessage("Input Error", "Username cannot be empty.", "error", 2000);
                    }
                });

                // 3. Attach Listener for Daily Goal Card (NEW)
                if (dailyGoalCardEl) {
                    dailyGoalCardEl.addEventListener('click', setDailyGoal);
                }


            } catch (error) {
                console.error("Firebase initialization error:", error);
                showMessage("Setup Error", "Failed to initialize Firebase. Check console for details.", "error");
            }
        };

        // --- FIRESTORE OPERATIONS (TASKS) ---

        const getCollectionPath = (uid) => {
            // Private data path for the user tasks
            return `artifacts/${appId}/users/${uid}/tasks`;
        };

        const addTask = async (taskData) => {
            if (!isAuthReady || !userId) {
                showMessage("Auth Error", "Authentication not ready. Please wait.", "error");
                return;
            }
            try {
                const colRef = collection(db, getCollectionPath(userId));
                await addDoc(colRef, {
                    ...taskData,
                    isComplete: false,
                    createdAt: new Date().toISOString(),
                    completionDate: null,
                    userId: userId,
                });
                showMessage("Success", "Task added successfully!", "success", 2000);
            } catch (error) {
                console.error("Error adding document: ", error);
                showMessage("Error", "Failed to add task.", "error");
            }
        };

        const toggleTaskCompletion = async (taskId, isComplete, points) => {
            if (!isAuthReady || !userId) return;
            try {
                const taskRef = doc(db, getCollectionPath(userId), taskId);
                const completionDate = isComplete ? new Date().toISOString() : null;
                const score = isComplete ? points : 0;
                
                await updateDoc(taskRef, {
                    isComplete: isComplete,
                    completionDate: completionDate,
                    scoreEarned: score
                });
                
                // --- STREAK LOGIC TRIGGER ---
                if (isComplete) {
                    await updateUserStreak();
                } else {
                    // NOTE: If a task is marked incomplete, we do NOT reset the streak. 
                    // The streak only depends on the *last time* a task was completed.
                }
            } catch (error) {
                console.error("Error updating document: ", error);
                showMessage("Error", "Failed to update task status.", "error");
            }
        };

        const deleteTask = async (taskId) => {
            if (!isAuthReady || !userId) return;
            try {
                const taskRef = doc(db, getCollectionPath(userId), taskId);
                await deleteDoc(taskRef);
                showMessage("Removed", "Task deleted.", "info", 2000);
            } catch (error) {
                console.error("Error deleting document: ", error);
                showMessage("Error", "Failed to delete task.", "error");
            }
        };

        // --- REAL-TIME LISTENER ---

        const startTaskListener = () => {
            if (!db || !userId) return;

            const tasksRef = collection(db, getCollectionPath(userId));
            const taskQuery = query(tasksRef); 
            
            // onSnapshot provides real-time updates
            onSnapshot(taskQuery, (snapshot) => {
                const tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTasks(tasks);
                calculateMetrics(tasks);
            }, (error) => {
                console.error("Firestore snapshot error:", error);
                showMessage("Data Error", "Failed to fetch real-time tasks.", "error");
            });
            
            // Remove the loading message once we try to listen
            loadingMessageEl.classList.add('hidden');
        };

        // --- UI RENDERING AND METRICS CALCULATION ---

        const renderTasks = (tasks) => {
            tasksListEl.innerHTML = ''; // Clear existing tasks

            if (tasks.length === 0) {
                tasksListEl.innerHTML = '<p class="text-center text-gray-500 py-4">No tasks yet! Add one above.</p>';
                return;
            }

            // Sort tasks: Incomplete first, then by points (higher points first)
            tasks.sort((a, b) => {
                // Incomplete tasks always come before complete ones
                if (a.isComplete !== b.isComplete) {
                    return a.isComplete ? 1 : -1;
                }
                // Sort by points (higher points first for prioritization)
                return b.points - a.points;
            });
            
            tasks.forEach(task => {
                const isCompleted = task.isComplete;
                const points = parseInt(task.points, 10);
                const targetDateText = task.targetDate ? new Date(task.targetDate).toLocaleDateString() : 'No Target';

                const listItem = document.createElement('div');
                listItem.className = `task-list-item flex items-center p-3 rounded-lg border shadow-sm ${
                    isCompleted ? 'bg-green-50 border-green-200 line-through text-gray-500' : 
                    points === 10 ? 'bg-red-50 border-red-200' :
                    points === 5 ? 'bg-yellow-50 border-yellow-200' :
                    'bg-white border-gray-200'
                }`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = isCompleted;
                checkbox.className = 'form-checkbox h-5 w-5 text-indigo-600 rounded mr-4 transition duration-150 ease-in-out';
                checkbox.addEventListener('change', (e) => {
                    toggleTaskCompletion(task.id, e.target.checked, points);
                });

                const content = document.createElement('div');
                content.className = 'flex-1 min-w-0';
                
                const title = document.createElement('p');
                title.className = `text-base font-medium ${isCompleted ? 'line-through text-gray-500' : 'text-gray-800'}`;
                title.textContent = task.description;

                const meta = document.createElement('p');
                meta.className = `text-xs ${isCompleted ? 'text-gray-400' : 'text-gray-500'}`;
                const completionText = isCompleted ? `Completed: ${new Date(task.completionDate).toLocaleDateString()}` : `Target: ${targetDateText}`;
                meta.innerHTML = `<span class="font-bold mr-2 text-indigo-600">${points} Pts</span> | ${completionText}`;

                content.appendChild(title);
                content.appendChild(meta);

                const deleteButton = document.createElement('button');
                deleteButton.className = 'ml-4 p-1 rounded-full text-gray-400 hover:text-red-600 hover:bg-red-100 transition duration-150';
                deleteButton.innerHTML = `
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3m-3 0h10"></path>
                    </svg>
                `;
                deleteButton.addEventListener('click', () => {
                    deleteTask(task.id);
                });

                listItem.appendChild(checkbox);
                listItem.appendChild(content);
                listItem.appendChild(deleteButton);
                tasksListEl.appendChild(listItem);
            });
        };

        const calculateMetrics = (tasks) => {
            let totalLifetimeScore = 0;
            let totalTasksCompleted = 0;
            let todayScore = 0;
            let weekScore = 0;
            // Removed monthScore and yearScore as they aren't currently displayed
            // let monthScore = 0;
            // let yearScore = 0;

            const today = new Date();

            tasks.forEach(task => {
                if (task.isComplete) {
                    const points = parseInt(task.points, 10) || 0;
                    totalLifetimeScore += points;
                    totalTasksCompleted += 1;

                    // Calculate time-based scores using completionDate
                    if (task.completionDate) {
                        const completionTime = new Date(task.completionDate);

                        if (isSameDay(completionTime, today)) {
                            todayScore += points;
                        }

                        if (isWithinLast7Days(completionTime)) {
                             weekScore += points;
                        }
                        
                        /*
                        if (isCurrentMonth(completionTime)) {
                             monthScore += points;
                        }
                        
                        if (isCurrentYear(completionTime)) {
                             yearScore += points;
                        }
                        */
                    }
                }
            });

            // Calculate VvV Ratio (Average Task Value)
            const vvvRatio = totalTasksCompleted > 0 ? (totalLifetimeScore / totalTasksCompleted) : 0;
            
            // Update the Dashboard UI
            document.getElementById('lifetime-score').textContent = totalLifetimeScore;
            document.getElementById('today-score').textContent = todayScore;
            document.getElementById('week-score').textContent = weekScore;
            document.getElementById('vvv-ratio').textContent = vvvRatio.toFixed(1);
            
            // NEW: Update Daily Goal Display
            updateDailyGoalDisplay(userProfile.dailyGoal, todayScore);
        };

        // --- EVENT LISTENERS (Form Submission) ---

        document.getElementById('add-task-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const description = document.getElementById('task-description').value.trim();
            const points = parseInt(document.getElementById('task-points').value, 10);
            const targetDate = document.getElementById('target-date').value;

            if (description && points) {
                await addTask({
                    description,
                    points,
                    targetDate: targetDate || null, // Store date as string or null
                });
                
                // Reset form fields
                document.getElementById('task-description').value = '';
                document.getElementById('task-points').value = '10';
                document.getElementById('target-date').value = '';
            }
        });

        // Start everything
        initFirebase();
    </script>
</body>
</html>
