<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Productivity Tracker</title>
    <!-- Load required front-end libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
    </style>
</head>
<body>
    <!-- Root element for React app -->
    <div id="root">
        <div class="p-8 text-center text-gray-500">Loading Application...</div>
    </div>

    <!-- 
        FIX: Firebase SDKs MUST be loaded synchronously before the app script 
        to ensure the 'firebase' global object is defined.
    -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>

    <!-- The entire application code, placed after dependencies -->
    <script type="text/babel">
        // Access global React functionality
        const { useState, useEffect, useCallback, useMemo } = React;

        // Access global Firebase functionality (now guaranteed to be defined)
        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = firebase.auth;
        const { getFirestore, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, collection, query } = firebase.firestore;
        const { setLogLevel } = firebase.firestore; 

        // Initialize environment variables (MANDATORY)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Date Helper Functions ---
        const getDayStart = (date) => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
        };

        const isSameDay = (d1, d2) => {
            const date1 = getDayStart(d1);
            const date2 = getDayStart(d2);
            return date1.getTime() === date2.getTime();
        };

        const isYesterday = (date) => {
            const d = getDayStart(new Date());
            d.setDate(d.getDate() - 1);
            return isSameDay(date, d);
        };

        const isWithinLast7Days = (date) => {
            const today = getDayStart(new Date());
            const sevenDaysAgo = getDayStart(new Date());
            sevenDaysAgo.setDate(today.getDate() - 7);
            return getDayStart(date) >= sevenDaysAgo && getDayStart(date) <= today;
        };

        // --- Main Application Component (The App function MUST be defined before render) ---
        const App = () => {
            // --- State Management ---
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [userId, setUserId] = useState(null);
            const [isAuthReady, setIsAuthReady] = useState(false);
            const [tasks, setTasks] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [taskInput, setTaskInput] = useState({
                description: '',
                points: 10,
                targetDate: '',
            });
            const [userProfile, setUserProfile] = useState({
                username: null,
                dailyStreak: 0,
                lastCompletionDate: null,
                dailyGoal: 50,
            });
            const [message, setMessage] = useState(null);

            // --- Message Box Component (Inline) ---
            const MessageBox = ({ message }) => {
                if (!message) return null;

                const { title, body, type } = message;
                const baseClass = "fixed bottom-4 right-4 p-4 rounded-lg shadow-xl transition-all duration-300 z-50";
                let typeClass = '';

                if (type === 'success') {
                    typeClass = 'bg-green-100 border-l-4 border-green-500 text-green-700 border-l-8';
                } else if (type === 'info') {
                    typeClass = 'bg-blue-100 border-l-4 border-blue-500 text-blue-700 border-l-8';
                } else {
                    typeClass = 'bg-red-100 border-l-4 border-red-500 text-red-700 border-l-8';
                }

                return (
                    <div className={`${baseClass} ${typeClass}`} role="alert">
                        <p className="font-bold">{title}</p>
                        <p>{body}</p>
                    </div>
                );
            };

            // Helper to show a message and automatically clear it
            const pushMessage = useCallback((title, body, type = 'error', duration = 4000) => {
                setMessage({ title, body, type });
                setTimeout(() => setMessage(null), duration);
            }, []);

            // --- Firestore Path Helper ---
            const getCollectionPath = useCallback((uid) => {
                return `artifacts/${appId}/users/${uid}/tasks`;
            }, []);

            const getUserProfileDocRef = useCallback((uid) => {
                // Must ensure db is defined before calling doc()
                if (!db) return null;
                return doc(db, `artifacts/${appId}/users/${uid}/profile/info`);
            }, [db]);


            // --- User Profile, Streak, and Goal Logic ---

            const saveUserProfile = useCallback(async (newUsername = userProfile.username, isSilent = false) => {
                if (!isAuthReady || !userId || !db) return;

                if (newUsername && newUsername.trim().length < 3 && !isSilent) {
                    pushMessage("Validation Error", "Username must be at least 3 characters.", "error", 3000);
                    return;
                }

                try {
                    const docRef = getUserProfileDocRef(userId);
                    if (!docRef) return;

                    const dataToSave = {
                        username: newUsername ? newUsername.trim() : userProfile.username,
                        dailyStreak: userProfile.dailyStreak,
                        lastCompletionDate: userProfile.lastCompletionDate,
                        dailyGoal: userProfile.dailyGoal,
                    };

                    await setDoc(docRef, dataToSave, { merge: true });

                    // Update local state
                    setUserProfile(prev => ({
                        ...prev,
                        username: dataToSave.username,
                        dailyStreak: dataToSave.dailyStreak,
                        lastCompletionDate: dataToSave.lastCompletionDate,
                        dailyGoal: dataToSave.dailyGoal,
                    }));

                    if (!isSilent) {
                        pushMessage("Success", `Profile updated.`, "success", 3000);
                    }
                } catch (error) {
                    console.error("Error saving user profile:", error);
                    pushMessage("Error", "Failed to save user profile data.", "error");
                }
            }, [isAuthReady, userId, db, userProfile, getUserProfileDocRef, pushMessage]);
            
            // Streak maintenance check on load (part of loadUserProfile)
            const maintainStreakOnLoad = (data) => {
                let { dailyStreak, lastCompletionDate } = data;
                
                if (!lastCompletionDate) return data;
                
                const lastDate = new Date(lastCompletionDate);
                const today = new Date();

                if (isSameDay(lastDate, today) || isYesterday(lastDate)) {
                    return data;
                }
                
                const dayBeforeYesterday = getDayStart(new Date());
                dayBeforeYesterday.setDate(dayBeforeYesterday.getDate() - 2); 
                
                if (lastDate < dayBeforeYesterday) {
                    dailyStreak = 0;
                    lastCompletionDate = null;
                    return { ...data, dailyStreak: 0, lastCompletionDate: null };
                }
                return data;
            };


            const updateUserStreak = useCallback(async () => {
                if (!isAuthReady || !userId) return;

                const today = new Date();
                const { lastCompletionDate, dailyStreak } = userProfile;

                // 1. Check if a task was already completed today
                if (lastCompletionDate && isSameDay(new Date(lastCompletionDate), today)) {
                    return;
                }

                let newStreak = dailyStreak;

                if (lastCompletionDate) {
                    const lastDate = new Date(lastCompletionDate);

                    if (isYesterday(lastDate)) {
                        // Streak continues!
                        newStreak += 1;
                        pushMessage("Streak!", `Daily streak increased to ${newStreak} days!`, "success", 3000);
                    } else {
                        // Streak is broken (completion was before yesterday)
                        newStreak = 1;
                        pushMessage("New Streak!", "Started a new daily streak!", "info", 3000);
                    }
                } else {
                    // First ever completion
                    newStreak = 1;
                    pushMessage("First Completion!", "You started your first daily streak!", "success", 3000);
                }

                // Update the profile state and save
                setUserProfile(prev => ({
                    ...prev,
                    dailyStreak: newStreak,
                    lastCompletionDate: today.toISOString(),
                }));
                // Save silently as this is part of task completion flow
                await saveUserProfile(userProfile.username, true); 

            }, [isAuthReady, userId, userProfile, saveUserProfile, pushMessage]);
            
            const loadUserProfile = useCallback(async (uid) => {
                if (!db) return;
                try {
                    const docRef = getUserProfileDocRef(uid);
                    if (!docRef) return; // Safegaurd

                    // NOTE: Calling getDoc from the global firebase object
                    const docSnap = await firebase.firestore.getDoc(docRef);
                    
                    let data = { 
                        username: null, 
                        dailyStreak: 0, 
                        lastCompletionDate: null, 
                        dailyGoal: 50 
                    };

                    if (docSnap.exists()) {
                        data = { ...data, ...docSnap.data() };
                    }
                    
                    // Streak maintenance logic
                    const maintainedData = maintainStreakOnLoad(data);
                    setUserProfile(maintainedData);
                    
                    // If streak was reset, save the profile immediately.
                    if (maintainedData.dailyStreak !== data.dailyStreak) {
                        // Must call the local save function, not the one from dependencies if it relies on local state update
                        await setDoc(docRef, maintainedData, { merge: true });
                    }

                } catch (error) {
                    console.warn("Could not load user profile:", error);
                }
            }, [db, getUserProfileDocRef]);


            // --- Firebase Initialization and Auth Effect ---
            useEffect(() => {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.error("Firebase config is missing.");
                    return;
                }

                try {
                    // Initialize the app and services (using global firebase object)
                    const app = firebase.initializeApp(firebaseConfig);
                    const firestoreDb = firebase.firestore.getFirestore(app);
                    const firestoreAuth = firebase.auth.getAuth(app);

                    setDb(firestoreDb);
                    setAuth(firestoreAuth);
                    firebase.firestore.setLogLevel('Debug'); // Enable Firestore debug logs

                    // Monitor Auth State (using global firebase object)
                    const unsubscribe = firebase.auth.onAuthStateChanged(firestoreAuth, async (user) => {
                        if (user) {
                            setUserId(user.uid);
                            setIsAuthReady(true);
                        } else if (initialAuthToken) {
                            await firebase.auth.signInWithCustomToken(firestoreAuth, initialAuthToken);
                        } else {
                            // Fallback to anonymous sign-in
                            const anonUser = await firebase.auth.signInAnonymously(firestoreAuth);
                            setUserId(anonUser.user.uid);
                            setIsAuthReady(true);
                        }
                    });

                    return () => unsubscribe();

                } catch (error) {
                    console.error("Firebase initialization error:", error);
                    pushMessage("Setup Error", "Failed to initialize Firebase.", "error");
                }
            }, [pushMessage]);


            // --- Load Profile on Auth Ready ---
            useEffect(() => {
                if (isAuthReady && userId && db) {
                    loadUserProfile(userId);
                }
            }, [isAuthReady, userId, db, loadUserProfile]);


            // --- Task Listener Effect (Real-time updates) ---
            useEffect(() => {
                if (!db || !userId) return;

                setIsLoading(true);

                const tasksRef = collection(db, getCollectionPath(userId));
                const taskQuery = query(tasksRef);

                const unsubscribe = onSnapshot(taskQuery, (snapshot) => {
                    const fetchedTasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setTasks(fetchedTasks);
                    setIsLoading(false);
                }, (error) => {
                    console.error("Firestore snapshot error:", error);
                    pushMessage("Data Error", "Failed to fetch real-time tasks.", "error");
                    setIsLoading(false);
                });

                return () => unsubscribe();
            }, [db, userId, getCollectionPath, pushMessage]);


            // --- Firestore Operations (Tasks) ---

            const addTask = useCallback(async () => {
                if (!isAuthReady || !userId || !db) {
                    pushMessage("Auth Error", "Authentication not ready. Please wait.", "error");
                    return;
                }

                const { description, points, targetDate } = taskInput;
                if (!description || !points) {
                    pushMessage("Input Error", "Please provide a description and points.", "error");
                    return;
                }

                try {
                    const colRef = collection(db, getCollectionPath(userId));
                    await addDoc(colRef, {
                        description,
                        points: parseInt(points, 10),
                        targetDate: targetDate || null,
                        isComplete: false,
                        createdAt: new Date().toISOString(),
                        completionDate: null,
                        scoreEarned: 0,
                        userId: userId,
                    });
                    pushMessage("Success", "Task added successfully!", "success", 2000);
                    setTaskInput({ description: '', points: 10, targetDate: '' }); // Reset form
                } catch (error) {
                    console.error("Error adding document: ", error);
                    pushMessage("Error", "Failed to add task.", "error");
                }
            }, [isAuthReady, userId, db, taskInput, getCollectionPath, pushMessage]);


            const toggleTaskCompletion = useCallback(async (taskId, isComplete, points) => {
                if (!isAuthReady || !userId || !db) return;
                try {
                    const taskRef = doc(db, getCollectionPath(userId), taskId);
                    const completionDate = isComplete ? new Date().toISOString() : null;
                    const score = isComplete ? points : 0;

                    await updateDoc(taskRef, {
                        isComplete: isComplete,
                        completionDate: completionDate,
                        scoreEarned: score
                    });

                    if (isComplete) {
                        await updateUserStreak();
                    }

                } catch (error) {
                    console.error("Error updating document: ", error);
                    pushMessage("Error", "Failed to update task status.", "error");
                }
            }, [isAuthReady, userId, db, getCollectionPath, updateUserStreak, pushMessage]);


            const deleteTask = useCallback(async (taskId) => {
                if (!isAuthReady || !userId || !db) return;
                try {
                    const taskRef = doc(db, getCollectionPath(userId), taskId);
                    await deleteDoc(taskRef);
                    pushMessage("Removed", "Task deleted.", "info", 2000);
                } catch (error) {
                    console.error("Error deleting document: ", error);
                    pushMessage("Error", "Failed to delete task.", "error");
                }
            }, [isAuthReady, userId, db, getCollectionPath, pushMessage]);

            // --- Task Input Form Handler ---
            const handleFormSubmit = (e) => {
                e.preventDefault();
                addTask();
            };

            // --- Metrics Calculation (Memoized) ---
            const metrics = useMemo(() => {
                let totalLifetimeScore = 0;
                let totalTasksCompleted = 0;
                let todayScore = 0;
                let weekScore = 0;

                const today = new Date();

                tasks.forEach(task => {
                    if (task.isComplete) {
                        const points = parseInt(task.points, 10) || 0;
                        totalLifetimeScore += points;
                        totalTasksCompleted += 1;

                        if (task.completionDate) {
                            const completionTime = new Date(task.completionDate);

                            if (isSameDay(completionTime, today)) {
                                todayScore += points;
                            }

                            if (isWithinLast7Days(completionTime)) {
                                weekScore += points;
                            }
                        }
                    }
                });

                const vvvRatio = totalTasksCompleted > 0 ? (totalLifetimeScore / totalTasksCompleted) : 0;

                return {
                    totalLifetimeScore,
                    totalTasksCompleted,
                    todayScore,
                    weekScore,
                    vvvRatio: vvvRatio.toFixed(1)
                };
            }, [tasks]);


            // --- User Profile and Goal Setter Handlers ---
            const handleUsernameSet = () => {
                if (!isAuthReady || !userId) {
                    pushMessage("Wait", "Authentication is still loading. Please wait a moment.", "info", 2000);
                    return;
                }

                const currentName = userProfile.username || '';
                // Using window.prompt since custom modals for user input are overkill here
                const newName = window.prompt(`Enter your desired username (Current: ${currentName || 'None'}).`);

                if (newName !== null && newName.trim()) {
                    saveUserProfile(newName.trim());
                } else if (newName !== null) {
                    pushMessage("Input Error", "Username cannot be empty.", "error", 2000);
                }
            };

            const handleDailyGoalSet = () => {
                if (!isAuthReady || !userId) {
                    pushMessage("Wait", "Authentication is still loading. Please wait a moment.", "info", 2000);
                    return;
                }

                const currentGoal = userProfile.dailyGoal || 50;
                const newGoalStr = window.prompt(`Enter your daily score goal (Current: ${currentGoal} points). Enter 0 to disable.`);

                if (newGoalStr !== null) {
                    const newGoal = parseInt(newGoalStr.trim(), 10);
                    if (!isNaN(newGoal) && newGoal >= 0) {
                        const updatedProfile = { ...userProfile, dailyGoal: newGoal };
                        setUserProfile(updatedProfile);
                        // Using saveUserProfile with the current username but silence feedback
                        saveUserProfile(updatedProfile.username, false); 
                        pushMessage("Goal Set", `Daily score goal updated to ${newGoal} points!`, "success", 3000);
                    } else {
                        pushMessage("Validation Error", "Please enter a valid number (0 or higher).", "error", 3000);
                    }
                }
            };

            // --- Components ---

            const TaskItem = ({ task }) => {
                const isCompleted = task.isComplete;
                const points = parseInt(task.points, 10);
                const targetDateText = task.targetDate ? new Date(task.targetDate).toLocaleDateString() : 'No Target';

                const itemClass = `flex items-center p-3 rounded-xl border shadow-sm transition-all duration-200 ${
                    isCompleted 
                        ? 'bg-green-50 border-green-200 line-through text-gray-500 hover:bg-green-100' 
                        : points === 10 
                            ? 'bg-red-50 border-red-200 hover:bg-red-100' 
                            : points === 5 
                                ? 'bg-yellow-50 border-yellow-200 hover:bg-yellow-100' 
                                : 'bg-white border-gray-200 hover:shadow-md'
                }`;
                
                const pointColor = isCompleted ? 'text-gray-400' : 'text-indigo-600';

                return (
                    <div className={itemClass}>
                        <input
                            type="checkbox"
                            checked={isCompleted}
                            onChange={(e) => toggleTaskCompletion(task.id, e.target.checked, points)}
                            className="form-checkbox h-5 w-5 text-indigo-600 rounded mr-4 focus:ring-indigo-500 transition duration-150 ease-in-out cursor-pointer"
                        />

                        <div className="flex-1 min-w-0">
                            <p className={`text-base font-medium ${isCompleted ? 'line-through text-gray-500' : 'text-gray-800'}`}>
                                {task.description}
                            </p>
                            <p className={`text-xs ${isCompleted ? 'text-gray-400' : 'text-gray-500'}`}>
                                <span className={`font-bold mr-2 ${pointColor}`}>{points} Pts</span> | 
                                {isCompleted 
                                    ? ` Completed: ${new Date(task.completionDate).toLocaleDateString()}` 
                                    : ` Target: ${targetDateText}`
                                }
                            </p>
                        </div>

                        <button
                            onClick={() => deleteTask(task.id)}
                            className="ml-4 p-1 rounded-full text-gray-400 hover:text-red-600 hover:bg-red-100 transition duration-150"
                            title="Delete Task"
                        >
                            <svg className="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3m-3 0h10"></path>
                            </svg>
                        </button>
                    </div>
                );
            };

            const MetricsDashboard = () => {
                const { todayScore, vvvRatio, weekScore, totalLifetimeScore } = metrics;
                const dailyGoal = userProfile.dailyGoal;
                const goalMet = dailyGoal > 0 && todayScore >= dailyGoal;

                let goalCardClass = 'metric-card p-5 rounded-xl text-center cursor-pointer transition duration-150 hover:shadow-lg';
                if (dailyGoal > 0) {
                    goalCardClass += goalMet ? ' bg-emerald-600 text-white' : ' bg-indigo-100 text-indigo-800 hover:bg-indigo-200';
                } else {
                    goalCardClass += ' bg-gray-100 text-gray-500 hover:bg-gray-200';
                }

                return (
                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-10">
                        {/* Today's Score (Primary Metric) */}
                        <div className="metric-card bg-indigo-600 text-white p-5 rounded-xl text-center">
                            <p className="text-sm font-medium opacity-80">Today's Score</p>
                            <p className="text-4xl font-bold mt-1">{todayScore}</p>
                        </div>
                        
                        {/* Daily Goal Progress */}
                        <div 
                            className={goalCardClass} 
                            title={dailyGoal > 0 ? `Daily Goal: ${dailyGoal} points` : "Daily Goal Disabled. Click to set."}
                            onClick={handleDailyGoalSet}
                        >
                            <p className="text-sm font-medium" id="daily-goal-title">Daily Goal Progress</p>
                            <p className="text-3xl font-bold mt-1">
                                {dailyGoal > 0 ? `${todayScore} / ${dailyGoal}` : 'Disabled'}
                            </p>
                        </div>
                        
                        {/* Average Task Value (VvV Ratio - Quality Metric) */}
                        <div className="metric-card bg-white p-5 rounded-xl text-center border-b-4 border-amber-500">
                            <p className="text-sm font-medium text-gray-600">Avg Task Value (VvV)</p>
                            <p className="text-3xl font-bold text-amber-600 mt-1">{vvvRatio}</p>
                        </div>
                        
                        {/* Last 7 Days Score */}
                        <div className="metric-card bg-white p-5 rounded-xl text-center">
                            <p className="text-sm font-medium text-gray-600">7-Day Score</p>
                            <p className="text-3xl font-bold text-gray-800 mt-1">{weekScore}</p>
                        </div>
                        
                        {/* Total Lifetime Score */}
                        <div className="metric-card bg-white p-5 rounded-xl text-center">
                            <p className="text-sm font-medium text-gray-600">Lifetime Score</p>
                            <p className="text-3xl font-bold text-gray-800 mt-1">{totalLifetimeScore}</p>
                        </div>
                    </div>
                );
            };

            const TaskList = ({ tasks, isLoading }) => {
                
                if (isLoading) {
                    return <p className="text-center text-gray-500 py-8">Loading tasks and profile...</p>;
                }

                if (tasks.length === 0) {
                    return <p className="text-center text-gray-500 py-4">No tasks yet! Add one above.</p>;
                }

                // Sort tasks: Incomplete first, then by points (higher points first)
                const sortedTasks = [...tasks].sort((a, b) => {
                    if (a.isComplete !== b.isComplete) {
                        return a.isComplete ? 1 : -1;
                    }
                    return b.points - a.points;
                });

                return (
                    <div className="space-y-3">
                        {sortedTasks.map(task => (
                            <TaskItem key={task.id} task={task} />
                        ))}
                    </div>
                );
            };

            // --- Main Render ---
            return (
                <div className="min-h-screen p-4 sm:p-8 bg-gray-50">
                    <div className="max-w-6xl mx-auto">
                        <h1 className="text-4xl font-extrabold text-gray-900 mb-6 text-center">
                            Progress Score Tracker (SBPT)
                        </h1>
                        <p className="text-center text-gray-600 mb-8">
                            Track anything: Academics, Work, Fitness. Focus on high-value tasks!
                        </p>

                        {/* Metrics Dashboard */}
                        <MetricsDashboard />

                        {/* Task Input and List Container */}
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            {/* Add New Task Form */}
                            <div className="lg:col-span-1 bg-white p-6 rounded-xl shadow-lg h-fit">
                                <h2 className="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2">Add New Task</h2>
                                <form onSubmit={handleFormSubmit} className="space-y-4">
                                    <div>
                                        <label htmlFor="task-description" className="block text-sm font-medium text-gray-700">Task/Goal</label>
                                        <input
                                            type="text"
                                            id="task-description"
                                            required
                                            value={taskInput.description}
                                            onChange={(e) => setTaskInput(prev => ({ ...prev, description: e.target.value }))}
                                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label htmlFor="task-points" className="block text-sm font-medium text-gray-700">Point Value (1, 5, or 10)</label>
                                        <select
                                            id="task-points"
                                            required
                                            value={taskInput.points}
                                            onChange={(e) => setTaskInput(prev => ({ ...prev, points: parseInt(e.target.value, 10) }))}
                                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500"
                                        >
                                            <option value={10}>10 - High Value / Crucial</option>
                                            <option value={5}>5 - Medium Value / Standard</option>
                                            <option value={1}>1 - Low Value / Maintenance</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label htmlFor="target-date" className="block text-sm font-medium text-gray-700">Target Date</label>
                                        <input
                                            type="date"
                                            id="target-date"
                                            value={taskInput.targetDate}
                                            onChange={(e) => setTaskInput(prev => ({ ...prev, targetDate: e.target.value }))}
                                            className="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500"
                                        />
                                    </div>
                                    <button type="submit" className="w-full py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                                        Add Task
                                    </button>
                                </form>
                            </div>

                            {/* Task List */}
                            <div className="lg:col-span-2 bg-white p-6 rounded-xl shadow-lg">
                                <h2 className="text-2xl font-semibold text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
                                    Active Tasks
                                    {/* Profile and Streak Display */}
                                    <div className="flex items-center space-x-3">
                                        {/* Daily Streak */}
                                        <span className="text-sm font-semibold text-emerald-600 flex items-center bg-emerald-100 px-3 py-1 rounded-full shadow-md">
                                            🔥 {userProfile.dailyStreak}
                                        </span>
                                        {/* Username Display/Set Button */}
                                        <button 
                                            onClick={handleUsernameSet}
                                            className={`text-xs font-medium px-3 py-1 rounded-full transition duration-150 shadow-md ${
                                                userProfile.username 
                                                    ? 'bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-semibold' 
                                                    : userId 
                                                        ? 'bg-amber-100 hover:bg-amber-200 text-amber-700' 
                                                        : 'bg-gray-100 text-gray-500'
                                            }`}
                                        >
                                            {userProfile.username 
                                                ? `Welcome, ${userProfile.username}` 
                                                : userId 
                                                    ? `Set Username (ID: ${userId.substring(0, 5)}...)`
                                                    : 'Loading User...'
                                            }
                                        </button>
                                    </div>
                                </h2>
                                <TaskList tasks={tasks} isLoading={isLoading || !isAuthReady} />
                            </div>
                        </div>
                    </div>
                    
                    {/* Custom Message Box */}
                    <MessageBox message={message} />
                </div>
            );
        };

        // --- Final Render Call ---
        // This is the critical step that relies on 'App' being defined above.
        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<App />);
        }

    </script>
</body>
</html>
